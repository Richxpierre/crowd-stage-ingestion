name: Refresh approved official conference websites
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      source_slug:
        description: 'Approved source slug to force refresh (leave blank to refresh due sources)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: crowdstage-official-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RENDER_HTML: '1'
      COLLECTOR_USER_AGENT: ${{ vars.COLLECTOR_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Refresh websites
        shell: bash
        env:
          SOURCE_SLUG: ${{ inputs.source_slug }}
        run: |
          if [ -n "$SOURCE_SLUG" ]; then
            python -m collector.sync --slug "$SOURCE_SLUG"
          else
            python -m collector.sync
          fi
