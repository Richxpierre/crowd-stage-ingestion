name: Review ingestion cleanup proposals
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crowdstage-cleanup-review
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      CLAUDE_ENRICHMENT_ENABLED: ${{ vars.CLAUDE_ENRICHMENT_ENABLED }}
      AI_ENRICHMENT_ENABLED: '0'
      OPENAI_PAUSED: '1'
      COLLECTOR_USER_AGENT: ${{ vars.COLLECTOR_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - id: pending
        name: Check cleanup queue before browser setup
        run: |
          python - <<'PY'
          import os
          from collector.client import Client
          from collector.pipeline_control import configuration
          db=Client();control=configuration(db,'cleanup')
          batches=db.request('GET','conference_cleanup_batches',params={'paused':'eq.false','select':'id,calls_used,calls_limit'}) if control['can_run'] else []
          active=any(b['calls_used']<b['calls_limit'] for b in batches)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('active='+str(active).lower()+'\n')
          PY
      - if: steps.pending.outputs.active == 'true'
        run: pip install -r requirements-crawler.txt
      - if: steps.pending.outputs.active == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('requirements.txt', 'requirements-crawler.txt') }}
      - if: steps.pending.outputs.active == 'true'
        run: python -m playwright install --with-deps chromium
      - if: steps.pending.outputs.active == 'true'
        run: python -m collector.cleanup_review
