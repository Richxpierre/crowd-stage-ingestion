name: Backend checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_ai_probe:
        description: 'Make one paid read-only OpenAI enrichment probe (no database writes)'
        default: false
        type: boolean
      run_manus_probe:
        description: 'Read-only Manus authentication and budget-readiness check (creates no task)'
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  manus-readiness:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/feat/manus-backup') || (github.event_name == 'workflow_dispatch' && inputs.run_manus_probe)
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m scripts.probe_manus
        env:
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
          MANUS_BACKUP_ENABLED: '1'
  ai-mini-enrichment-probe:
    # Paid checks are manual, separate from ordinary CI. No database credentials,
    # scheduled execution or fork/PR secret exposure.
    if: github.event_name == 'workflow_dispatch' && inputs.run_ai_probe
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m scripts.probe_mini_enrichment
        env:
          AI_ENRICHMENT_ENABLED: '1'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_CRAWLER_MODEL: ${{ vars.OPENAI_CRAWLER_MODEL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-mini-enrichment-probe
          path: mini-enrichment-probe.json
  source-validator-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-crawler.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/start_search_service.py
      - run: python -m scripts.probe_source_validator
        env:
          SEARXNG_URL: http://127.0.0.1:8888
          COLLECTOR_USER_AGENT: ${{ vars.COLLECTOR_USER_AGENT }}
      - run: python -m scripts.probe_validation_strategies
        env:
          CRAWL4_AI_BASE_DIRECTORY: ${{ runner.temp }}/strategy-probe
          COLLECTOR_USER_AGENT: ${{ vars.COLLECTOR_USER_AGENT }}
      - run: python -m scripts.probe_metadata
        env:
          SEARXNG_URL: http://127.0.0.1:8888
          COLLECTOR_USER_AGENT: ${{ vars.COLLECTOR_USER_AGENT }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-validator-probe
          path: |
            validator-probe.json
            validator-strategy-probe.json
      - if: always()
        run: docker rm -f crowdstage-search || true
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -v
        env:
          RUN_RENDER_TESTS: '1'
      - run: python -m compileall -q collector scripts
  search-service:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/start_search_service.py
      - run: python -m unittest discover -s tests -p test_search.py -v
        env:
          SEARXNG_URL: http://127.0.0.1:8888
          RUN_SEARXNG_TESTS: '1'
      - if: always()
        run: docker rm -f crowdstage-search || true
  crawler-sdk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-crawler.txt
      - run: pip install -r requirements-crawler.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p test_discovery.py -v
        env:
          RUN_CRAWLER_TESTS: '1'
          CRAWL4_AI_BASE_DIRECTORY: ${{ runner.temp }}/crowdstage-crawler


