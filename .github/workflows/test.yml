name: Backend checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-validator-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-crawler.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/start_search_service.py
      - run: python -m scripts.probe_source_validator
        env:
          SEARXNG_URL: http://127.0.0.1:8888
          COLLECTOR_USER_AGENT: ${{ vars.COLLECTOR_USER_AGENT }}
      - run: python -m scripts.probe_validation_strategies
        env:
          CRAWL4_AI_BASE_DIRECTORY: ${{ runner.temp }}/strategy-probe
          COLLECTOR_USER_AGENT: ${{ vars.COLLECTOR_USER_AGENT }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-validator-probe
          path: |
            validator-probe.json
            validator-strategy-probe.json
      - if: always()
        run: docker rm -f crowdstage-search || true
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -v
        env:
          RUN_RENDER_TESTS: '1'
      - run: python -m compileall -q collector scripts
  search-service:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/start_search_service.py
      - run: python -m unittest discover -s tests -p test_search.py -v
        env:
          SEARXNG_URL: http://127.0.0.1:8888
          RUN_SEARXNG_TESTS: '1'
      - if: always()
        run: docker rm -f crowdstage-search || true
  crawler-sdk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-crawler.txt
      - run: pip install -r requirements-crawler.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p test_discovery.py -v
        env:
          RUN_CRAWLER_TESTS: '1'
          CRAWL4_AI_BASE_DIRECTORY: ${{ runner.temp }}/crowdstage-crawler


