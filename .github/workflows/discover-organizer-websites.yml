name: Discover organizer websites with Crawl4AI
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crowdstage-aggregator-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COLLECTOR_USER_AGENT: ${{ vars.COLLECTOR_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-crawler.txt
      - run: pip install -r requirements.txt
      - name: Claim an admin-queued or scheduled crawl
        id: claim
        run: python -m collector.discovery --claim-only "$RUNNER_TEMP/crawl-job.json"
      - if: steps.claim.outputs.has_job == 'true'
        run: pip install -r requirements-crawler.txt
      - if: steps.claim.outputs.has_job == 'true'
        run: python -m playwright install --with-deps chromium
      - name: Discover and verify organizer sources
        if: steps.claim.outputs.has_job == 'true'
        run: python -m collector.discovery --job-file "$RUNNER_TEMP/crawl-job.json"
        env:
          CRAWL4_AI_BASE_DIRECTORY: ${{ runner.temp }}/crowdstage-crawler
      - name: Record worker setup failure
        if: failure() && steps.claim.outputs.has_job == 'true'
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from datetime import datetime,timezone
          from collector.client import Client
          job=json.loads((Path(os.environ['RUNNER_TEMP'])/'crawl-job.json').read_text())
          Client().update_crawl_job(job['id'],{'status':'failed','summary':'Crawler worker failed; inspect GitHub Actions logs and retry','completed_at':datetime.now(timezone.utc).isoformat()})
          PY
