name: Discover organizer websites with Crawl4AI
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Queued crawl job ID (optional; limits this run to that job)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: crowdstage-aggregator-discovery
  cancel-in-progress: false
jobs:
  discover:
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COLLECTOR_USER_AGENT: ${{ vars.COLLECTOR_USER_AGENT }}
      AI_ENRICHMENT_ENABLED: ${{ vars.AI_ENRICHMENT_ENABLED }}
      OPENAI_CRAWLER_MODEL: ${{ vars.OPENAI_CRAWLER_MODEL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-crawler.txt
      - run: pip install -r requirements.txt
      - name: Claim an admin-queued or scheduled crawl
        id: claim
        shell: bash
        env:
          CRAWL_JOB_ID: ${{ inputs.job_id }}
        run: |
          if [ -n "$CRAWL_JOB_ID" ]; then
            python -m collector.discovery --claim-only "$RUNNER_TEMP/crawl-job.json" --job-id "$CRAWL_JOB_ID"
          else
            python -m collector.discovery --claim-only "$RUNNER_TEMP/crawl-job.json"
          fi
      - if: steps.claim.outputs.has_job == 'true'
        run: pip install -r requirements-crawler.txt
      - if: steps.claim.outputs.has_job == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('requirements.txt', 'requirements-crawler.txt') }}
      - if: steps.claim.outputs.has_job == 'true'
        run: python -m playwright install --with-deps chromium
      - name: Start private SearXNG search assistance when enabled
        if: steps.claim.outputs.has_job == 'true'
        continue-on-error: true
        run: python scripts/start_search_service.py --job-file "$RUNNER_TEMP/crawl-job.json"
      - name: Collect organizer website-button URLs
        if: steps.claim.outputs.has_job == 'true'
        run: python -m collector.discovery --job-file "$RUNNER_TEMP/crawl-job.json" --drain-bulk
        env:
          CRAWL4_AI_BASE_DIRECTORY: ${{ runner.temp }}/crowdstage-crawler
          SEARXNG_URL: http://127.0.0.1:8888
          BULK_WORKFLOW_TOKEN: ${{ github.token }}
      - name: Stop private search service
        if: always() && steps.claim.outputs.has_job == 'true'
        run: docker rm -f crowdstage-search || true
      - name: Record worker setup failure
        if: failure() && steps.claim.outputs.has_job == 'true'
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from datetime import datetime,timezone
          from collector.client import Client
          job=json.loads((Path(os.environ['RUNNER_TEMP'])/'crawl-job.json').read_text())
          Client().update_crawl_job(job['id'],{'status':'failed','summary':'Crawler worker failed; inspect GitHub Actions logs and retry','completed_at':datetime.now(timezone.utc).isoformat()})
          PY


