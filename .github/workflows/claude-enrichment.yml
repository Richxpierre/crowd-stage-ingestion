name: Process Claude core brain enrichment
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crowdstage-claude-enrichment
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-haiku-4-5-20251001' }}
      CLAUDE_ENRICHMENT_ENABLED: ${{ vars.CLAUDE_ENRICHMENT_ENABLED || '1' }}
      COLLECTOR_USER_AGENT: ${{ vars.COLLECTOR_USER_AGENT || 'CrowdStage-Intelligence/1.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run Claude Core Brain Worker
        run: python -m collector.claude_worker
      - name: Publish readiness
        if: always()
        continue-on-error: true
        run: python -m scripts.report_enrichment_status
