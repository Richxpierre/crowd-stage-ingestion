name: Process Claude core brain enrichment
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crowdstage-claude-enrichment
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      CLAUDE_ENRICHMENT_ENABLED: ${{ vars.CLAUDE_ENRICHMENT_ENABLED }}
      COLLECTOR_USER_AGENT: ${{ vars.COLLECTOR_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check admin control before browser setup
        id: pending
        run: |
          python - <<'PY'
          import os
          from collector.client import Client
          from collector.pipeline_control import configuration
          active=configuration(Client(),'claude')['can_run']
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('active='+str(active).lower()+'\n')
          PY
      - if: steps.pending.outputs.active == 'true'
        run: pip install -r requirements-crawler.txt
      - if: steps.pending.outputs.active == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('requirements.txt', 'requirements-crawler.txt') }}
      - if: steps.pending.outputs.active == 'true'
        run: python -m playwright install --with-deps chromium
      - name: Run Claude Core Brain Worker with Live Token Tracking
        if: steps.pending.outputs.active == 'true'
        run: python -m collector.claude_worker
      - name: Publish readiness and live token tracking
        if: always()
        continue-on-error: true
        run: python -m scripts.report_enrichment_status
